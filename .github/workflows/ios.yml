name: Compila IPA per iPhone

# Si avvia a mano: Actions -> "Compila IPA per iPhone" -> "Run workflow".
#
# L'URL dell'app si puo' dare in due modi: scrivendolo nel campo qui sotto
# (la via rapida) oppure una volta sola come secret APP_URL. Se manca
# entrambi, la compilazione va avanti lo stesso con un segnaposto: serve a
# vedere che la pipeline funziona e ad avere l'app sul telefono. Mostrera'
# la pagina "non riesco a raggiungere il server" finche' non si rifa' la
# build con l'URL vero.
on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "URL del deploy (vuoto = usa il secret APP_URL, o un segnaposto)"
        required: false
        type: string

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Installa le dipendenze
        run: npm ci

      - name: Decidi quale URL usare
        id: url
        env:
          INPUT_URL: ${{ inputs.app_url }}
          SECRET_URL: ${{ secrets.APP_URL }}
        run: |
          scelto="$INPUT_URL"
          origine="campo del modulo"
          if [[ -z "$scelto" ]]; then
            scelto="$SECRET_URL"
            origine="secret APP_URL"
          fi
          if [[ -z "$scelto" ]]; then
            scelto="https://esempio-non-configurato.invalid"
            origine="segnaposto"
            {
              echo "### Nessun URL configurato"
              echo ""
              echo "L'IPA verrà compilato lo stesso, ma l'app mostrerà la pagina"
              echo "\"non riesco a raggiungere il server\"."
              echo ""
              echo "Per averla funzionante: rilancia questo workflow scrivendo"
              echo "l'URL del deploy nel campo, oppure impostalo una volta sola"
              echo "in Settings → Secrets and variables → Actions come \`APP_URL\`."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

          if [[ ! "$scelto" =~ ^https:// ]]; then
            echo "L'URL deve iniziare per https:// — ricevuto qualcosa di diverso."
            exit 1
          fi

          # Il controllo di raggiungibilita' avvisa, non blocca: sapere che il
          # server non risponde e' utile, ma non e' un buon motivo per negare
          # l'IPA a chi il deploy non l'ha ancora fatto.
          code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$scelto" || echo "000")
          echo "Il server risponde: $code (origine URL: $origine)"
          if [[ "$code" == "000" ]]; then
            echo "::warning::L'URL non risponde. L'IPA verrà comunque compilato."
          fi

          echo "value=$scelto" >> "$GITHUB_OUTPUT"

      - name: Genera il progetto iOS
        env:
          APP_URL: ${{ steps.url.outputs.value }}
        run: |
          npx cap add ios
          npx cap sync ios

      # `ios/` non e' nel repo: viene rigenerato da zero a ogni build, quindi
      # un Info.plist modificato a mano andrebbe perso al giro dopo. Il
      # permesso della fotocamera (per @capacitor/barcode-scanner) va
      # aggiunto qui, non nel progetto. Senza questa riga iOS chiude l'app
      # di colpo alla prima richiesta di accesso alla fotocamera invece di
      # mostrare il permesso -- non e' un avviso, e' un crash garantito.
      - name: Aggiungi il permesso della fotocamera
        run: |
          /usr/libexec/PlistBuddy -c \
            "Add :NSCameraUsageDescription string 'Per leggere il codice a barre di un prodotto.'" \
            ios/App/App/Info.plist

      # Senza questo, ogni IPA installato ha la stessa versione (quella di
      # default del progetto generato da Capacitor): non c'e' modo di sapere
      # quale build hai sul telefono dopo un sideload. La versione viene da
      # package.json (la scegli tu, quando conta), il numero di build dal
      # progressivo del workflow (cresce da solo a ogni compilazione).
      - name: Calcola versione e numero di build
        id: versione
        run: |
          versione=$(node -p "require('./package.json').version")
          echo "version=$versione" >> "$GITHUB_OUTPUT"
          echo "build=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Versione $versione, build $GITHUB_RUN_NUMBER"

      - name: Genera icona e splash dell'app
        run: npx capacitor-assets generate --ios

      - name: Mostra schemi e target disponibili
        run: xcodebuild -list -project ios/App/App.xcodeproj || true

      - name: Compila (senza firma)
        env:
          VERSIONE: ${{ steps.versione.outputs.version }}
          BUILD: ${{ steps.versione.outputs.build }}
        run: |
          set -o pipefail
          # Capacitor 8 usa Swift Package Manager: c'e' un .xcodeproj, non un
          # .xcworkspace da CocoaPods. Lo schema non e' condiviso nel progetto
          # generato, quindi se manca si ripiega sul target, che esiste sempre.
          #
          # MARKETING_VERSION/CURRENT_PROJECT_VERSION passati qui vincono su
          # qualunque valore nel progetto generato: e' il modo giusto di
          # impostare CFBundleShortVersionString/CFBundleVersion da riga di
          # comando, che funziona sia se l'Info.plist li referenzia come
          # variabili (il default dei template Xcode moderni) sia se non lo
          # fa -- toccare l'Info.plist a mano varrebbe solo nel primo caso.
          common=(
            -project ios/App/App.xcodeproj
            -configuration Release
            -sdk iphoneos
            -derivedDataPath "$PWD/build"
            CODE_SIGNING_ALLOWED=NO
            CODE_SIGNING_REQUIRED=NO
            CODE_SIGN_IDENTITY=""
            CODE_SIGN_ENTITLEMENTS=""
            MARKETING_VERSION="$VERSIONE"
            CURRENT_PROJECT_VERSION="$BUILD"
          )
          if xcodebuild -list -project ios/App/App.xcodeproj 2>/dev/null | sed -n '/Schemes:/,$p' | grep -qx "        App"; then
            echo "Compilo con lo schema App"
            xcodebuild "${common[@]}" -scheme App build
          else
            echo "Schema non condiviso: compilo con il target App"
            xcodebuild "${common[@]}" -target App build
          fi

      - name: Impacchetta l'IPA
        env:
          VERSIONE: ${{ steps.versione.outputs.version }}
          BUILD: ${{ steps.versione.outputs.build }}
        run: |
          app_path=$(find build/Build/Products -maxdepth 2 -name "App.app" -type d | head -1)
          if [[ -z "$app_path" ]]; then
            echo "App.app non trovata: la compilazione non ha prodotto il binario."
            find build/Build/Products -maxdepth 3 2>/dev/null || true
            exit 1
          fi
          echo "Trovata: $app_path"
          rm -rf Payload && mkdir -p Payload
          cp -R "$app_path" Payload/
          zip -qry PersonalTrainer-unsigned.ipa Payload
          size=$(du -h PersonalTrainer-unsigned.ipa | cut -f1)
          echo "IPA pronto: $size, versione $VERSIONE (build $BUILD)"
          {
            echo "### IPA pronto ($size) — versione $VERSIONE, build $BUILD"
            echo ""
            echo "Scaricalo qui sotto da **Artifacts → PersonalTrainer-ipa**,"
            echo "poi installalo con AltStore o SideStore."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Pubblica l'IPA come artifact
        uses: actions/upload-artifact@v4
        with:
          name: PersonalTrainer-ipa
          path: PersonalTrainer-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
